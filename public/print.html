<!doctype html>
<html lang="en-AU">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'">
  <meta name="theme-color" content="#1e3a8a">
  <title>ClientStream document</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="stylesheet" href="/print.css">
</head>
<body>
  <div class="toolbar"><button id="print-button">Print / Save PDF</button><button id="close-button">Close</button></div>
  <main class="paper" id="document">
    <header class="doc-head">
      <div class="brand"><svg class="brand-mark document-logo" viewBox="0 0 64 48" aria-hidden="true">
  <path d="M14 4A12 12 0 0 0 2 16v6a12 12 0 0 0 12 12h6l6 6v-6h6a12 12 0 0 0 12-12v-6A12 12 0 0 0 32 4H14Z" fill="#1e3a8a"/>
  <path d="M50 4a12 12 0 0 1 12 12v6a12 12 0 0 1-12 12h-6l-6 6v-6h-6a12 12 0 0 1-12-12v-6A12 12 0 0 1 32 4h18Z" fill="#0ea5e9" opacity=".84"/>
</svg><span id="business-name">ClientStream</span></div>
      <div class="doc-title"><span id="doc-kind">Document</span><strong id="doc-number"></strong></div>
    </header>
    <section class="meta"><div><p id="business-abn"></p><p id="business-email"></p><p id="business-phone"></p><p id="business-address"></p></div></section>
    <section class="meta">
      <div><span>Bill to</span><strong id="client-name"></strong><p id="client-company"></p><p id="client-address"></p><p id="client-email"></p></div>
      <div class="meta-right"><p><span>Status</span><strong id="doc-status"></strong></p><p><span id="date-label">Date</span><strong id="doc-date"></strong></p><p><span id="secondary-date-label">Due</span><strong id="secondary-date"></strong></p></div>
    </section>
    <table>
      <thead><tr><th>Description</th><th>Qty</th><th>Unit</th><th>Total</th></tr></thead>
      <tbody id="items-body"></tbody>
    </table>
    <section class="totals">
      <div><span>Subtotal</span><strong id="subtotal"></strong></div>
      <div><span id="tax-label">GST</span><strong id="tax"></strong></div>
      <div class="grand"><span>Total</span><strong id="total"></strong></div>
      <div id="paid-row" class="hidden"><span>Paid</span><strong id="paid"></strong></div>
      <div id="balance-row" class="hidden grand"><span>Balance</span><strong id="balance"></strong></div>
    </section>
    <section id="notes-section" class="notes hidden"><span>Notes</span><p id="notes"></p></section>
  </main>
  <div id="error" class="error hidden"></div>
  <script type="module" src="/print.js"></script>
</body>
</html>
