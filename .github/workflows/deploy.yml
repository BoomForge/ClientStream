name: Deploy ClientStream

on:
  # ClientStream retired 2026-11-07: no automatic deployments.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: clientstream-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - name: Checkout validated revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check Cloudflare credentials
        id: cloudflare
        shell: bash
        run: |
          if [[ -n "$CLOUDFLARE_API_TOKEN" && -n "$CLOUDFLARE_ACCOUNT_ID" ]]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Cloudflare deploy skipped: repository secrets are not configured yet."
          fi

      - name: Install dependencies
        if: steps.cloudflare.outputs.ready == 'true'
        run: npm install

      - name: Stamp checked-out release revision
        if: steps.cloudflare.outputs.ready == 'true'
        run: node scripts/stamp-revision.mjs "$(git rev-parse HEAD)"

      - name: Apply D1 migrations
        if: steps.cloudflare.outputs.ready == 'true'
        run: npx wrangler d1 migrations apply clientstream-db --remote

      - name: Inspect legacy password iteration counts (counts only)
        if: steps.cloudflare.outputs.ready == 'true'
        run: npx wrangler d1 execute clientstream-db --remote --command "SELECT COUNT(*) AS credentials_over_worker_limit FROM password_credentials WHERE iterations > 100000"

      - name: Read-only inventory of existing users and PayPal subscriptions
        if: steps.cloudflare.outputs.ready == 'true'
        run: |
          # Count only: never print names, email addresses or payment identifiers.
          npx wrangler d1 execute clientstream-db --remote --command "SELECT (SELECT COUNT(*) FROM users) AS registered_users, (SELECT COUNT(*) FROM subscriptions WHERE provider = 'paypal' AND status IN ('active','pending')) AS possibly_active_paypal_subscriptions"

      - name: Deploy Worker and static assets
        if: steps.cloudflare.outputs.ready == 'true'
        run: npx wrangler deploy

      - name: Verify paused production without creating user accounts or charges
        if: steps.cloudflare.outputs.ready == 'true'
        env:
          CLIENTSTREAM_SMOKE_URL: https://clientstream.theevansorrell.workers.dev
          CLIENTSTREAM_EXPECT_REVISION: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: node scripts/smoke-maintenance.mjs

      - name: Verify SiteGuard referral remains closed during pause
        if: steps.cloudflare.outputs.ready == 'true'
        run: node scripts/probe-siteguard-sales.mjs
