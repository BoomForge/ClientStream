name: Deploy ClientStream

on:
  workflow_run:
    workflows: ["ClientStream CI"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: clientstream-production
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - name: Checkout validated revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check Cloudflare credentials
        id: cloudflare
        shell: bash
        run: |
          if [[ -n "$CLOUDFLARE_API_TOKEN" && -n "$CLOUDFLARE_ACCOUNT_ID" ]]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Cloudflare deploy skipped: repository secrets are not configured yet."
          fi

      - name: Install dependencies
        if: steps.cloudflare.outputs.ready == 'true'
        run: npm install

      - name: Apply D1 migrations
        if: steps.cloudflare.outputs.ready == 'true'
        run: npx wrangler d1 migrations apply clientstream-db --remote

      - name: Inspect legacy password iteration counts (counts only)
        if: steps.cloudflare.outputs.ready == 'true'
        run: npx wrangler d1 execute clientstream-db --remote --command "SELECT COUNT(*) AS credentials_over_worker_limit FROM password_credentials WHERE iterations > 100000"

      - name: Deploy Worker and static assets
        if: steps.cloudflare.outputs.ready == 'true'
        run: npx wrangler deploy

      - name: End-to-end production smoke test (with scoped Worker diagnostics)
        if: steps.cloudflare.outputs.ready == 'true'
        shell: bash
        env:
          CLIENTSTREAM_SMOKE_URL: https://clientstream.theevansorrell.workers.dev
        run: |
          set -euo pipefail
          # Capture only registration hash errors for the disposable smoke request;
          # do not dump unrelated request logs, tokens, or customer information.
          npx wrangler tail clientstream --format pretty --method POST --search "ClientStream registration password derivation failed" > /tmp/clientstream-hash-tail.log 2>&1 &
          tail_pid=$!
          trap 'kill "$tail_pid" 2>/dev/null || true' EXIT
          sleep 5
          if ! npm run smoke:production; then
            sleep 3
            echo "Filtered Worker registration diagnostics:"
            tail -n 45 /tmp/clientstream-hash-tail.log
            exit 1
          fi
