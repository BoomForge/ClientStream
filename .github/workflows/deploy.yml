name: Deploy ClientStream

on:
  workflow_run:
    workflows: ["ClientStream CI"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: clientstream-production
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - name: Checkout validated revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check Cloudflare credentials
        id: cloudflare
        shell: bash
        run: |
          if [[ -n "$CLOUDFLARE_API_TOKEN" && -n "$CLOUDFLARE_ACCOUNT_ID" ]]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Cloudflare deploy skipped: repository secrets are not configured yet."
          fi

      - name: Install dependencies
        if: steps.cloudflare.outputs.ready == 'true'
        run: npm install

      - name: Apply D1 migrations
        if: steps.cloudflare.outputs.ready == 'true'
        run: npx wrangler d1 migrations apply clientstream-db --remote

      - name: Deploy Worker and static assets
        if: steps.cloudflare.outputs.ready == 'true'
        run: npx wrangler deploy
