name: Deploy ClientStream Marketing

on:
  push:
    branches: [main]
    paths:
      - marketing/index.html
      - marketing/siteguard.html
      - marketing/robots.txt
      - marketing/sitemap.xml
      - marketing/a94f813e21c847d6a986ebc34615f0d2.txt
      - wrangler.marketing.jsonc
      - .github/workflows/deploy-marketing.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Safety check
        shell: bash
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          ! grep -R "clientstream.replit.app" marketing
          grep -q 'siteguard.clientstream.io' marketing/siteguard.html
          grep -q 'href="/siteguard.html"' marketing/index.html
          test -f marketing/siteguard.html
      - name: Verify live ClientStream application before marketing cutover
        shell: bash
        run: |
          curl --fail --silent --show-error --location --max-time 20 --output /dev/null https://app.clientstream.io/
      - name: Deploy marketing site
        run: npx wrangler deploy --config wrangler.marketing.jsonc
      - name: Verify publicly reachable marketing Worker
        shell: bash
        run: |
          set -euo pipefail
          origin="https://purple-cell-493f.theevansorrell.workers.dev"
          curl --fail --silent --show-error --location --max-time 20 "$origin/siteguard.html" | grep -q 'If your website goes offline'
          curl --fail --silent --show-error --location --max-time 20 "$origin/" | grep -q 'href="/siteguard.html"'
          echo "SITEGUARD PUBLIC MARKETING WORKER VERIFIED"
