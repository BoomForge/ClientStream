name: Deploy ClientStream Marketing

on:
  # ClientStream retired 2026-11-07: no automatic marketing deployments.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Safety check
        shell: bash
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          ! grep -R "clientstream.replit.app" marketing
          grep -q 'no longer available for new subscriptions' marketing/siteguard.html
          ! grep -q 'whop.com/checkout/' marketing/siteguard.html
          ! grep -q 'api/siteguard/referral' marketing/index.html
          grep -q 'ClientStream is taking a break' marketing/index.html
          test -f marketing/siteguard.html
      - name: Verify live ClientStream application before marketing cutover
        shell: bash
        run: |
          curl --fail --silent --show-error --location --max-time 20 --output /dev/null https://app.clientstream.io/api/health
      - name: Deploy marketing site
        run: npx wrangler deploy --config wrangler.marketing.jsonc
      - name: Verify publicly reachable marketing Worker
        shell: bash
        run: |
          set -euo pipefail
          origin="https://purple-cell-493f.theevansorrell.workers.dev"
          curl --fail --silent --show-error --location --max-time 20 --output /tmp/clientstream-siteguard.html "$origin/siteguard.html"
          curl --fail --silent --show-error --location --max-time 20 --output /tmp/clientstream-marketing.html "$origin/"
          grep -q 'no longer available for new subscriptions' /tmp/clientstream-siteguard.html
          ! grep -q 'whop.com/checkout/' /tmp/clientstream-siteguard.html
          ! grep -q 'api/siteguard/referral' /tmp/clientstream-marketing.html
          grep -q 'ClientStream is taking a break' /tmp/clientstream-marketing.html
          echo "SITEGUARD RETIRED MARKETING WORKER VERIFIED"
