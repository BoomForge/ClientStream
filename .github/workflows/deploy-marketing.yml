name: Deploy ClientStream Marketing

on:
  push:
    branches: [main]
    paths:
      - marketing/index.html
      - marketing/siteguard.html
      - marketing/robots.txt
      - marketing/sitemap.xml
      - marketing/a94f813e21c847d6a986ebc34615f0d2.txt
      - wrangler.marketing.jsonc
      - .github/workflows/deploy-marketing.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Safety check
        shell: bash
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          ! grep -R "clientstream.replit.app" marketing
          grep -q 'siteguard.clientstream.io' marketing/siteguard.html
          grep -q 'href="/siteguard.html"' marketing/index.html
          test -f marketing/siteguard.html
      - name: Verify live ClientStream application before marketing cutover
        shell: bash
        run: |
          curl --fail --silent --show-error --location --max-time 20 --output /dev/null https://app.clientstream.io/
      - name: Deploy marketing site
        run: npx wrangler deploy --config wrangler.marketing.jsonc
      - name: Verify the public domain serves the new SiteGuard funnel
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5; do
            if curl --fail --silent --show-error --location --max-time 12 https://clientstream.io/siteguard.html | grep -q 'If your website goes offline'; then
              curl --fail --silent --show-error --location --max-time 12 https://clientstream.io/ | grep -q 'href="/siteguard.html"'
              curl --fail --silent --show-error --location --max-time 12 https://clientstream.io/sitemap.xml | grep -q '<urlset'
              echo "SITEGUARD MARKETING PUBLICLY VERIFIED"
              exit 0
            fi
            sleep 3
          done
          echo "Live domain is not serving latest marketing release" >&2
          exit 1
      - name: Inform IndexNow of newly published ClientStream and SiteGuard pages
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          key="a94f813e21c847d6a986ebc34615f0d2"
          received="$(curl --fail --silent --show-error --location --max-time 20 "https://clientstream.io/$key.txt")"
          test "$received" = "$key"
          python3 - <<'PY'
          import json, urllib.request
          data = json.dumps({
             "host": "clientstream.io",
             "key": "a94f813e21c847d6a986ebc34615f0d2",
             "urlList": ["https://clientstream.io/", "https://clientstream.io/siteguard.html"]
          }).encode("utf-8")
          request = urllib.request.Request("https://api.indexnow.org/indexnow", data=data,
              headers={"Content-Type": "application/json; charset=utf-8", "User-Agent": "ClientStream-SiteGuard-Discovery/1.0"},
              method="POST")
          with urllib.request.urlopen(request,timeout=20) as result:
              if result.status not in (200,202): raise RuntimeError("IndexNow rejected submission")
              print("INDEXNOW SUBMISSION ACCEPTED: HTTP", result.status)
          PY
