name: ClientStream production health

on:
  schedule:
    - cron: "11 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Check production API health
        env:
          CLIENTSTREAM_HEALTH_URL: ${{ vars.CLIENTSTREAM_HEALTH_URL }}
        run: node scripts/probe-health.mjs
      - name: Check unattended SiteGuard sales funnel and owned referral path
        run: node scripts/probe-siteguard-sales.mjs
      - name: Summarize seven-day SiteGuard referral clicks (aggregate only)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/report-siteguard-acquisition.mjs
