name: SiteGuard retirement — archived discovery task

# SiteGuard is no longer sold. Do not automatically submit old product
# listings to search indexes or third-party RSS directories.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  archived:
    runs-on: ubuntu-latest
    steps:
      - name: Confirm product discovery retired
        run: echo "SiteGuard sales and marketing discovery have been retired. No submission sent."
