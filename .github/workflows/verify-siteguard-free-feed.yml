name: Verify previously submitted SiteGuard feed listing

on:
  push:
    branches: [main]
    paths:
      - scripts/verify-siteguard-directory-publication.mjs

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Independently check public RSS listing without another submission
        run: node scripts/verify-siteguard-directory-publication.mjs
