name: Configure ClientStream Runtime

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  configure:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
      PUBLIC_APP_URL: ${{ secrets.PUBLIC_APP_URL }}
      SUPPORT_EMAIL: ${{ secrets.SUPPORT_EMAIL }}
      PAYPAL_CLIENT_ID: ${{ secrets.PAYPAL_CLIENT_ID }}
      PAYPAL_CLIENT_SECRET: ${{ secrets.PAYPAL_CLIENT_SECRET }}
      PAYPAL_PLAN_ID: ${{ secrets.PAYPAL_PLAN_ID }}
      PAYPAL_WEBHOOK_ID: ${{ secrets.PAYPAL_WEBHOOK_ID }}
      PAYPAL_ENVIRONMENT: ${{ secrets.PAYPAL_ENVIRONMENT }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Validate Cloudflare credentials
        shell: bash
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
      - name: Push configured runtime values
        shell: bash
        run: |
          set -euo pipefail
          count=0
          put_secret() {
            local name="$1"
            local value="$2"
            if [[ -n "$value" ]]; then
              printf '%s' "$value" | npx wrangler secret put "$name"
              count=$((count + 1))
            fi
          }

          put_secret RESEND_API_KEY "$RESEND_API_KEY"
          put_secret EMAIL_FROM "$EMAIL_FROM"
          put_secret PUBLIC_APP_URL "$PUBLIC_APP_URL"
          put_secret SUPPORT_EMAIL "$SUPPORT_EMAIL"
          put_secret PAYPAL_CLIENT_ID "$PAYPAL_CLIENT_ID"
          put_secret PAYPAL_CLIENT_SECRET "$PAYPAL_CLIENT_SECRET"
          put_secret PAYPAL_PLAN_ID "$PAYPAL_PLAN_ID"
          put_secret PAYPAL_WEBHOOK_ID "$PAYPAL_WEBHOOK_ID"
          put_secret PAYPAL_ENVIRONMENT "$PAYPAL_ENVIRONMENT"

          if [[ "$count" -eq 0 ]]; then
            echo "No optional runtime secrets were configured."
            exit 1
          fi

          echo "Configured $count ClientStream runtime values without exposing their contents."

