name: Configure ClientStream Runtime

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  configure:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
      PUBLIC_APP_URL: ${{ secrets.PUBLIC_APP_URL }}
      SUPPORT_EMAIL: ${{ secrets.SUPPORT_EMAIL }}
      SQUARE_ACCESS_TOKEN: ${{ secrets.SQUARE_ACCESS_TOKEN }}
      SQUARE_LOCATION_ID: ${{ secrets.SQUARE_LOCATION_ID }}
      SQUARE_PRO_PLAN_VARIATION_ID: ${{ secrets.SQUARE_PRO_PLAN_VARIATION_ID }}
      SQUARE_WEBHOOK_SIGNATURE_KEY: ${{ secrets.SQUARE_WEBHOOK_SIGNATURE_KEY }}
      SQUARE_WEBHOOK_URL: ${{ secrets.SQUARE_WEBHOOK_URL }}
      SQUARE_ENVIRONMENT: ${{ secrets.SQUARE_ENVIRONMENT }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Validate Cloudflare credentials
        shell: bash
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
      - name: Push configured runtime values
        shell: bash
        run: |
          set -euo pipefail
          count=0
          put_secret() {
            local name="$1"
            local value="$2"
            if [[ -n "$value" ]]; then
              printf '%s' "$value" | npx wrangler secret put "$name"
              count=$((count + 1))
            fi
          }

          put_secret RESEND_API_KEY "$RESEND_API_KEY"
          put_secret EMAIL_FROM "$EMAIL_FROM"
          put_secret PUBLIC_APP_URL "$PUBLIC_APP_URL"
          put_secret SUPPORT_EMAIL "$SUPPORT_EMAIL"
          put_secret SQUARE_ACCESS_TOKEN "$SQUARE_ACCESS_TOKEN"
          put_secret SQUARE_LOCATION_ID "$SQUARE_LOCATION_ID"
          put_secret SQUARE_PRO_PLAN_VARIATION_ID "$SQUARE_PRO_PLAN_VARIATION_ID"
          put_secret SQUARE_WEBHOOK_SIGNATURE_KEY "$SQUARE_WEBHOOK_SIGNATURE_KEY"
          put_secret SQUARE_WEBHOOK_URL "$SQUARE_WEBHOOK_URL"
          put_secret SQUARE_ENVIRONMENT "$SQUARE_ENVIRONMENT"

          if [[ "$count" -eq 0 ]]; then
            echo "No optional runtime secrets were configured."
            exit 1
          fi

          echo "Configured $count ClientStream runtime values without exposing their contents."
