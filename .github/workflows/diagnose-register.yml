name: Diagnose ClientStream Registration

on:
  push:
    branches: [debug/register-runtime]

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLIENTSTREAM_SMOKE_URL: https://clientstream.theevansorrell.workers.dev
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Tail runtime during smoke
        shell: bash
        run: |
          set +e
          timeout 20s npx wrangler tail clientstream --format=pretty > tail.log 2>&1 &
          tail_pid=$!
          sleep 4
          npm run smoke:production
          smoke_status=$?
          sleep 5
          kill "$tail_pid" 2>/dev/null || true
          wait "$tail_pid" 2>/dev/null || true
          echo "=== WORKER TAIL ==="
          cat tail.log
          exit "$smoke_status"
