name: Encrypted ClientStream D1 Backup

on:
  schedule:
    - cron: "43 16 * * 0"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      BACKUP_ENCRYPTION_PASSWORD: ${{ secrets.BACKUP_ENCRYPTION_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check backup credentials
        id: ready
        shell: bash
        run: |
          if [[ -n "$CLOUDFLARE_API_TOKEN" && -n "$CLOUDFLARE_ACCOUNT_ID" && -n "$BACKUP_ENCRYPTION_PASSWORD" ]]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Encrypted backup skipped until BACKUP_ENCRYPTION_PASSWORD is configured."
          fi
      - if: steps.ready.outputs.ready == 'true'
        run: npm install
      - name: Export D1
        if: steps.ready.outputs.ready == 'true'
        shell: bash
        run: |
          mkdir -p backup
          name="clientstream-$(date -u +%F).sql"
          npx wrangler d1 export clientstream-db --remote --skip-confirmation --output="backup/$name"
          openssl enc -aes-256-cbc -salt -pbkdf2 -iter 200000 -in "backup/$name" -out "backup/$name.enc" -pass env:BACKUP_ENCRYPTION_PASSWORD
          rm "backup/$name"
      - name: Store encrypted backup
        if: steps.ready.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: clientstream-d1-encrypted-${{ github.run_id }}
          path: backup/*.enc
          retention-days: 30
          if-no-files-found: error
